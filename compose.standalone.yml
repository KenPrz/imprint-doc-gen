name: imprint-standalone
services:
  app:
    image: ${IMPRINT_IMAGE:-ghcr.io/kenprz/imprint-doc-gen:standalone}
    build:
      context: .
      dockerfile: Dockerfile.standalone
    environment:
      IMPRINT_API_KEY: ${IMPRINT_API_KEY:?Set a secret of at least 24 characters}
      GOTENBERG_API_TIMEOUT: ${GOTENBERG_API_TIMEOUT:-60s}
    ports:
      - "127.0.0.1:${IMPRINT_PORT:-8088}:3000"
    volumes:
      - imprint-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 384
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 120s
    restart: unless-stopped
volumes:
  imprint-data: {}
