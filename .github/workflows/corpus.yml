name: Document corpus
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:formats
      - run: npm run docs:build
      - run: node scripts/generate-example.ts
      - run: git diff --exit-code -- examples/invoice
      - run: npm run corpus:generate
      - run: git diff --exit-code -- corpus
      - run: npm run corpus:validate
      - run: npm run corpus:render
      - run: npm run corpus:score
      - name: Enforce DOCX and XLSX corpus coverage
        run: node -e 'const r=require("./corpus/results/engine-score.json"); if(r.summary.docx.passed!==100 || r.summary.docx.failed!==0 || r.summary.xlsx.passed!==100 || r.summary.xlsx.failed!==0 || r.summary.xlsx.unsupported!==0) process.exit(1)'
      - name: Validate production and development Compose
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.override.yml config --quiet
          IMPRINT_API_KEY=imprint-ci-configuration-test-key docker compose -f compose.standalone.yml config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-validation
          path: corpus/results/*.json

  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: imprint-ci
      IMPRINT_API_KEY: imprint-ci-integration-test-key
      GOTENBERG_API_TIMEOUT: 5s
    steps:
      - uses: actions/checkout@v4
      - name: Build and start production services
        run: docker compose -f compose.yml up --build --wait --wait-timeout 120 -d
      - name: Verify production DOCX, XLSX and PDF API
        run: >-
          docker compose -f compose.yml run --rm --no-deps
          --user "$(id -u):$(id -g)"
          -e SMOKE_API_URL=http://app:3000
          -v "$PWD:/work" -w /work
          app node scripts/smoke.ts
      - name: Verify conversion timeout and automatic recovery
        run: >-
          docker compose -f compose.yml run --rm --no-deps
          --user "$(id -u):$(id -g)"
          -e SMOKE_API_URL=http://app:3000
          -v "$PWD:/work" -w /work
          app node scripts/converter-recovery.ts
      - name: Compare calculated XLSX values with independent LibreOffice recalculation
        run: |
          docker compose -f compose.yml run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD:/app/work" -w /app/work app node scripts/check-xlsx-calculation.ts --prepare
          docker compose -f compose.yml exec -T gotenberg sh -c 'mkdir -p /tmp/imprint-calc-input /tmp/imprint-calc-output && cat > /tmp/imprint-calc-input/imprint-calculated.xlsx' < corpus/results/calculation/imprint-calculated.xlsx
          docker compose -f compose.yml exec -T gotenberg timeout 60 libreoffice -env:UserInstallation=file:///tmp/imprint-calc-profile --headless --convert-to xlsx --outdir /tmp/imprint-calc-output /tmp/imprint-calc-input/imprint-calculated.xlsx
          docker compose -f compose.yml exec -T gotenberg cat /tmp/imprint-calc-output/imprint-calculated.xlsx > corpus/results/calculation/libreoffice-calculated.xlsx
          docker compose -f compose.yml run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD:/app/work" -w /app/work app node scripts/check-xlsx-calculation.ts --compare corpus/results/calculation/libreoffice-calculated.xlsx
      - name: Collect converter logs
        if: always()
        run: |
          mkdir -p corpus/results
          docker compose -f compose.yml logs --no-color > corpus/results/docker-conversion.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversion-validation
          path: |
            corpus/results/calculation/formula-comparison.json
            corpus/results/converter-recovery.json
            corpus/results/docker-conversion.log
      - name: Stop test services
        if: always()
        run: docker compose -f compose.yml down --volumes

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMPRINT_API_KEY: imprint-ci-standalone-integration-key
      IMPRINT_PORT: 8091
      IMPRINT_IMAGE: imprint-doc-gen:standalone-check
      IMPRINT_URL: http://127.0.0.1:8091
      IMPRINT_CONTAINER: imprint-standalone-ci-app-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
      - uses: docker/setup-buildx-action@v3
      - name: Build the standalone image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.standalone
          load: true
          tags: imprint-doc-gen:standalone-check
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone
      - name: Start a single container with a persistent volume
        run: docker compose -p imprint-standalone-ci -f compose.standalone.yml up --no-build --wait --wait-timeout 90 -d
      - name: Verify example integration, forced restart recovery and converter supervision
        run: node scripts/standalone-smoke.ts
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate synthetic invoices and images through the standalone API
        run: npm run test:synthetic -- --api --pdf --smoke --output corpus/results/synthetic
      - name: Compare new-format PDF text against independent expected documents
        run: npm run test:formats
      - name: Verify converter timeouts recover in the standalone image
        run: |
          GOTENBERG_API_TIMEOUT=5s docker compose -p imprint-standalone-ci -f compose.standalone.yml up --no-build --wait --wait-timeout 90 -d
          docker run --rm --network container:$IMPRINT_CONTAINER --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work -e IMPRINT_API_KEY \
            -e GOTENBERG_URL=http://127.0.0.1:3001 -e SMOKE_API_URL=http://127.0.0.1:3000 \
            --entrypoint node "$IMPRINT_IMAGE" scripts/converter-recovery.ts
      - name: Collect standalone logs
        if: always()
        run: |
          mkdir -p corpus/results
          docker compose -p imprint-standalone-ci -f compose.standalone.yml logs --no-color > corpus/results/standalone.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-validation
          path: |
            corpus/results/standalone-validation.json
            corpus/results/converter-recovery.json
            corpus/results/standalone.log
            corpus/results/synthetic/
            artifacts/formats/
      - name: Stop standalone services
        if: always()
        run: docker compose -p imprint-standalone-ci -f compose.standalone.yml down --volumes

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker compose -p imprint-cluster-ci -f compose.cluster-test.yml up -d --wait
      - name: Verify PostgreSQL, S3, worker fencing and signed callbacks
        run: npm run test:cluster
        env:
          TEST_DATABASE_URL: postgres://imprint:isolated-integration-password@127.0.0.1:18432/imprint
          AWS_ACCESS_KEY_ID: imprint-test
          AWS_SECRET_ACCESS_KEY: isolated-object-password
      - name: Validate cluster Compose
        run: docker compose -f compose.cluster.yml config --quiet
        env:
          POSTGRES_PASSWORD: isolated-configuration-password
          S3_BUCKET: example-private-bucket
          IMPRINT_API_KEY: isolated-configuration-key-32-chars
      - name: Stop disposable dependencies
        if: always()
        run: docker compose -p imprint-cluster-ci -f compose.cluster-test.yml down --volumes

  feature-office:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc poppler-utils
      - run: npm run test:feature-office
      - name: Verify worker metric aggregation rules
        run: docker run --rm --entrypoint promtool -v "$PWD/examples/operations:/work" -w /work prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules imprint-rules.test.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-feature-office-validation
          path: |
            artifacts/feature-expansion/office-validation.json
            artifacts/feature-expansion/*.png
            artifacts/feature-expansion/pdf/
            corpus/results/calculation/formula-comparison.json

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fixtures, conversion, standalone, cluster, feature-office]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.standalone
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kenprz/imprint-doc-gen:sha-${{ github.sha }}
            ghcr.io/kenprz/imprint-doc-gen:standalone
          cache-from: type=gha,scope=standalone
          provenance: mode=max
          sbom: true
