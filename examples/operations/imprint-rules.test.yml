rule_files:
  - imprint-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'imprint_renders_total{job="imprint-workers",instance="one",result="succeeded"}'
        values: '0+120x10'
      - series: 'imprint_renders_total{job="imprint-workers",instance="two",result="succeeded"}'
        values: '0+180x10'
      - series: 'imprint_active_renders{job="imprint-workers",instance="one"}'
        values: '2+0x10'
      - series: 'imprint_active_renders{job="imprint-workers",instance="two"}'
        values: '3+0x10'
      - series: 'imprint_queued_jobs{job="imprint-workers",instance="one"}'
        values: '7+0x10'
      - series: 'imprint_queued_jobs{job="imprint-workers",instance="two"}'
        values: '7+0x10'
    promql_expr_test:
      - expr: imprint:fleet_renders_per_second
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="imprint:fleet_renders_per_second"}'
            value: 5
      - expr: imprint:fleet_active_renders
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="imprint:fleet_active_renders"}'
            value: 5
      - expr: imprint:shared_queued_jobs
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="imprint:shared_queued_jobs"}'
            value: 7
